[project]
name = "vaultai-backend"
version = "0.1.0"
description = "VaultAI — private document assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "sqlite-vec>=0.1.6",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
