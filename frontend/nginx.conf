server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the 10 MB free-tier upload cap so the friendly 413 from
    # the backend wins; nginx only rejects if a client exceeds it wildly.
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass Cloudflare's real-client-IP header through so backend rate-limit
        # keying sees the user's IP (not a CF edge IP) on unauth routes.
        proxy_set_header Cf-Connecting-Ip $http_cf_connecting_ip;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
