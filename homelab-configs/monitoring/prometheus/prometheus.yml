global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: dashboard-vm
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: um890-node
    static_configs:
      - targets: ["10.0.0.20:9100"]

  - job_name: proxmox-hp
    static_configs:
      - targets: ["10.0.0.10:9100"]

  - job_name: proxmox-lenovo
    static_configs:
      - targets: ["10.0.0.11:9100"]
